name: Deploy Flowchart to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow SHA is current main
        id: current-main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq '.object.sha')"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo 'matches=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matches=false' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded workflow SHA $EXPECTED_SHA; main is $current_sha"
          fi

      - name: Checkout
        if: steps.current-main.outputs.matches == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        if: steps.current-main.outputs.matches == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flowchart/package-lock.json

      - name: Install dependencies
        if: steps.current-main.outputs.matches == 'true'
        run: npm ci --ignore-scripts
        working-directory: flowchart

      - name: Build
        if: steps.current-main.outputs.matches == 'true'
        run: npm run build
        working-directory: flowchart
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Setup Pages
        if: steps.current-main.outputs.matches == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload artifact
        if: steps.current-main.outputs.matches == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: flowchart/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verify artifact SHA is current main
        id: current-main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq '.object.sha')"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo 'matches=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matches=false' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded artifact SHA $EXPECTED_SHA; main is $current_sha"
          fi

      - name: Deploy to GitHub Pages
        if: steps.current-main.outputs.matches == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
